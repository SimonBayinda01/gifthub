<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Uganda Jobs Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Uganda Jobs Hub</h1>
    <p>Create your account</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main>

<section>
    <h2>Create an Account</h2>

    <form id="registerForm">

        <label for="fullName">Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">Register</button>

        <p id="message"></p>

    </form>
</section>

</main>

<footer>
    <p>© 2026 Uganda Jobs Hub</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://zrcfgdnvwnxvqlhitrxg.supabase.co";
const SUPABASE_KEY = "sb_publishable_fOw0gexQmWPzQlaaaiGVXQ_bgPE1crY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const registerForm = document.getElementById("registerForm");
const message = document.getElementById("message");

registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    message.textContent = "Creating your account...";

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                full_name: fullName
            }
        }
    });

    if (error) {
        message.textContent = error.message;
        return;
    }

    message.textContent = "Account created successfully! Check your email to verify your account.";

});

</script>

</body>
</html>
