<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - Uganda Jobs Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Uganda Jobs Hub</h1>
    <p>Post your job vacancy</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main>

<section>
    <h2>Post a Job</h2>

    <p><strong>Choose a package:</strong></p>

    <select id="package" required>
        <option value="Basic|10000">Basic - UGX 10,000</option>
        <option value="Featured|25000">Featured - UGX 25,000</option>
        <option value="Premium|50000">Premium - UGX 50,000</option>
    </select>

    <form id="jobForm">

        <label for="employerName">Employer Name</label>
        <input type="text" id="employerName" required>

        <label for="company">Company</label>
        <input type="text" id="company" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" required>

        <label for="title">Job Title</label>
        <input type="text" id="title" required>

        <label for="location">Location</label>
        <input type="text" id="location" required>

        <label for="description">Job Description</label>
        <textarea id="description" required></textarea>

        <label for="salary">Salary</label>
        <input type="text" id="salary">

        <button type="submit">Submit Job</button>

        <p id="result"></p>

    </form>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://zrcfgdnvwnxvqlhitrxg.supabase.co";
const SUPABASE_KEY = "sb_publishable_fOw0gexQmWPzQlaaaiGVXQ_bgPE1crY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

document.getElementById("jobForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const result = document.getElementById("result");
    result.textContent = "Submitting...";

    const selected = document.getElementById("package").value.split("|");

    const packageName = selected[0];
    const price = Number(selected[1]);

    const { error } = await supabaseClient
        .from("job_submissions")
        .insert({
            employer_name: document.getElementById("employerName").value.trim(),
            company: document.getElementById("company").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            title: document.getElementById("title").value.trim(),
            location: document.getElementById("location").value.trim(),
            description: document.getElementById("description").value.trim(),
            salary: document.getElementById("salary").value.trim(),
            package: packageName,
            price: price
        });

    if (error) {
        result.textContent = "Error: " + error.message;
        return;
    }

    result.textContent =
        "Job submitted successfully. An administrator will review it before publication.";

    document.getElementById("jobForm").reset();
});

</script>

</body>
</html>
